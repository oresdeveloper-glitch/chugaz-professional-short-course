services:
  - type: web
    name: chugaz-backend
    runtime: php
    rootDir: backend
    region: frankfurt
    plan: free
    buildCommand: composer install --no-interaction --prefer-dist --optimize-autoloader
    startCommand: |
      php artisan migrate --force &&
      php artisan db:seed --force &&
      php artisan storage:link &&
      php artisan serve --host=0.0.0.0 --port=10000
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://chugaz-backend.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - fromGroup: database
      - key: SANCTUM_STATEFUL_DOMAINS
        value: chugazshortcourse.com,chugaz-frontend.vercel.app
      - key: SESSION_DOMAIN
        value: .chugazshortcourse.com
      - key: NEXT_PUBLIC_API_URL
        value: https://chugaz-backend.onrender.com/api

databases:
  - name: chugaz-db
    region: frankfurt
    plan: free
    rootDir: backend
    databaseName: chugaz_db
    user: chugaz
